<div class="dna-card" data-dna-id="${id}">
	<div class="dna-card-head">
		<span class="dna-card-title">${titleHtml}</span>
		<span class="dna-card-badges">${badgesHtml}</span>
	</div>
	<div class="dna-card-desc">${descHtml}</div>
	<div class="dna-card-tags">${tagsHtml}</div>
	<div class="dna-card-actions">
		<button type="button" class="btn btn-mini" data-action="edit">${t('dnaCard.edit')}</button>
		<button type="button" class="btn btn-mini btn-ghost" data-action="dup">${t('dnaCard.duplicate')}</button>
		<button type="button" class="btn btn-mini btn-ghost" data-action="tpl">${tplLabel}</button>
		<button type="button" class="btn btn-mini btn-danger" data-action="del">${t('dnaCard.delete')}</button>
	</div>
</div>
