<!doctype html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Horsey CRISPR 数据库</title>
	<meta name="description" content="Horsey DNA 数据库" />
	<link rel="stylesheet" href="./styles.css" />
</head>

<body>
	<div id="app-root">
		<header class="app-header">
			<div class="app-brand" data-i18n="horseyDatabase.title"></div>
			<div class="app-search"><input type="search" id="global-search" data-i18n="search" /></div>
			<label class="cb-row"><input type="checkbox" id="templates-only" /> <span data-i18n="app.templatesOnly"></span></label>
			<div class="db-menu-wrap">
				<button type="button" class="btn db-menu-btn" id="db-menu-btn" data-i18n="app.databaseMenu"></button>
				<div class="db-dropdown" id="db-dropdown">
					<button type="button" data-db="export" data-i18n="app.exportDb"></button>
					<button type="button" data-db="import-merge" data-i18n="app.importMerge"></button>
					<button type="button" data-db="import-over" data-i18n="app.importOverwrite"></button>
					<button type="button" data-db="reset" data-i18n="app.resetDb"></button>
				</div>
			</div>
			<div class="app-header-aside">
				<a class="github-link" href="https://github.com/steve02081504/horsey-crispr-database" target="_blank" rel="noopener noreferrer" data-i18n="app.githubRepo"></a>
				<p class="app-attribution">Generated by <a class="link" href="https://github.com/steve02081504/fount" target="_blank" rel="noopener noreferrer">fount</a></p>
				<div class="app-lang-row">
					<label for="lang-select" data-i18n="app.language"></label>
					<select id="lang-select" class="lang-select"></select>
				</div>
			</div>
		</header>
		<div class="tips-bar tips-bar--empty" role="region" aria-labelledby="tips-bar-heading">
			<span id="tips-bar-heading" class="tips-bar-label" data-i18n="app.tipsBar"></span>
			<div class="tips-scroll-window">
				<div class="tips-scroll-host" id="tips-scroll-host"></div>
			</div>
		</div>
		<div class="template-strip-wrap">
			<div class="template-strip-head">
				<div class="template-strip-label" data-i18n="app.templateStrip"></div>
				<button type="button" class="btn btn-mini btn-ghost" id="tpl-toggle"></button>
			</div>
			<div class="template-strip" id="template-strip"></div>
		</div>
		<div class="layout">
			<aside class="list-panel">
				<div class="list-toolbar">
					<button type="button" class="btn" id="btn-new-dna" data-i18n="app.newDna"></button>
					<button type="button" class="btn btn-ghost" id="btn-tags" data-i18n="app.tagManager"></button>
				</div>
				<div class="tag-filter-wrap">
					<span class="tag-filter-label" data-i18n="app.filterTags"></span>
					<div class="tag-filter-chips" id="tag-filter-chips"></div>
				</div>
				<div class="list-scroll" id="dna-list"></div>
			</aside>
			<section class="editor-panel">
				<div class="editor-title-row">
					<div class="editor-dirty" id="editor-dirty"></div>
				</div>
				<div class="meta-grid">
					<div class="field">
						<label data-i18n="editor.name"></label>
						<input type="text" id="meta-name" />
					</div>
					<div class="field">
						<label data-i18n="editor.description"></label>
						<textarea id="meta-desc"></textarea>
					</div>
				</div>
				<div class="field">
					<label data-i18n="editor.tags"></label>
					<div class="meta-tags-wrap">
						<div id="meta-tags-chips" class="meta-tags-chips"></div>
						<div class="meta-tag-add-row">
							<select id="meta-tag-pick">
								<option value=""></option>
							</select>
							<button type="button" class="btn btn-mini btn-ghost" id="meta-tag-create" data-i18n="tags.createNewButton"></button>
						</div>
					</div>
				</div>
				<div class="cb-row">
					<input type="checkbox" id="meta-template" />
					<label for="meta-template" data-i18n="dnaCard.templateBadge"></label>
				</div>
				<div class="meta-actions">
					<button type="button" class="btn" id="btn-save-dna" data-i18n="editor.save"></button>
				</div>
				<div id="editor-mount"></div>
			</section>
		</div>
	</div>
	<input type="file" id="hidden-import-file" accept="application/json,.json" class="hidden" />
	<script type="module" src="./app.mjs"></script>
</body>

</html>
